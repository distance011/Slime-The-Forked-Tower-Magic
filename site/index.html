<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>史莱姆团 · 报名查询</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: "Microsoft YaHei","PingFang SC",sans-serif; background:#f0f2f5; min-height:100vh; }
  .header { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; padding:30px 20px; text-align:center; }
  .header h1 { font-size:28px; margin-bottom:6px; }
  .header p { opacity:.9; font-size:14px; }
  .container { max-width:760px; margin:24px auto; padding:0 16px; }
  .search-box { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:20px; display:flex; gap:10px; }
  .search-box input { flex:1; padding:12px 16px; font-size:16px; border:2px solid #e0e0e0; border-radius:8px; outline:none; }
  .search-box input:focus { border-color:#667eea; }
  .search-box button { padding:12px 24px; font-size:16px; border:none; border-radius:8px; background:#667eea; color:#fff; cursor:pointer; }
  .search-box button:hover { background:#5568d8; }
  .status { text-align:center; color:#999; padding:12px; }
  .result { background:#fff; border-radius:12px; padding:16px 20px; box-shadow:0 2px 8px rgba(0,0,0,.08); margin-bottom:14px; border-left:4px solid #667eea; }
  .result .car { font-size:17px; font-weight:600; color:#333; margin-bottom:8px; }
  .result .meta { font-size:13px; color:#888; margin-bottom:8px; }
  .result .info { display:flex; flex-wrap:wrap; gap:16px; font-size:15px; }
  .result .info span b { color:#555; font-weight:600; }
  .badge { display:inline-block; background:#eef2ff; color:#667eea; border-radius:6px; padding:2px 10px; font-size:14px; font-weight:600; }
  .link-btn { display:inline-block; background:#667eea; color:#fff; padding:6px 14px; border-radius:6px; text-decoration:none; font-size:13px; margin-top:10px; }
  .hint { text-align:center; color:#aaa; font-size:13px; margin-top:24px; padding-bottom:20px; }
  .foot { text-align:center; color:#bbb; font-size:12px; padding:12px; }
</style>
</head>
<body>
<div class="header">
  <h1>史莱姆团 · 报名查询</h1>
  <p>查询你填了哪个车表 · 在哪个队 · 打什么位置</p>
</div>
<div class="container">
  <div class="search-box">
    <input id="kw" placeholder="输入游戏ID 或 QQ号，回车查询" autocomplete="off">
    <button onclick="doQuery()">查询</button>
  </div>
  <div id="status" class="status">数据加载中...</div>
  <div id="results"></div>
  <div class="foot">数据更新于 <span id="genTime"></span></div>
  <div class="hint">查询数据来自车表名单，由团管理定期更新</div>
</div>
<script>
var DATA = {rosters: []};
fetch('data.json')
  .then(function(r) { return r.json(); })
  .then(function(d) {
    DATA = d;
    document.getElementById('status').textContent = '数据已加载，输入名字或QQ查询';
    document.getElementById('genTime').textContent = d.generated || '';
  })
  .catch(function() {
    document.getElementById('status').textContent = '数据加载失败';
  });

function doQuery() {
  var kw = document.getElementById('kw').value.trim();
  if (!kw) return;
  var status = document.getElementById('status');
  var results = [];
  var now = new Date();
  DATA.rosters.forEach(function(roster) {
    // 过滤已过期车次
    if (!isUpcoming(roster.time, now)) return;
    roster.players.forEach(function(p) {
      if (p.qq === kw || (p.name && p.name.indexOf(kw) >= 0)) {
        results.push({roster: roster, p: p});
      }
    });
  });
  // 按时间正序排列(早的在前)
  results.sort(function(a, b) {
    var ka = timeKey(a.roster.time), kb = timeKey(b.roster.time);
    for (var i = 0; i < 4; i++) { if (ka[i] !== kb[i]) return ka[i] - kb[i]; }
    return 0;
  });
  if (results.length === 0) {
    status.textContent = '未找到 "' + kw + '" 的未过期报名记录';
    document.getElementById('results').innerHTML = '';
    return;
  }
  status.textContent = '共找到 ' + results.length + ' 条记录(未过期, 按时间正序)';
  var box = document.getElementById('results');
  box.innerHTML = '';
  results.forEach(function(r) {
    var div = document.createElement('div');
    div.className = 'result';
    var jobs = (r.p.main || '/') + '/' + (r.p.sub || '/');
    div.innerHTML =
      '<div class="car">' + esc(r.roster.time) + '</div>' +
      '<div class="meta">车头 ' + esc(r.roster.leader) + '</div>' +
      '<div class="info">' +
        '<span><b>玩家:</b> ' + esc(r.p.name) + '</span>' +
        '<span><b>QQ:</b> ' + esc(r.p.qq) + '</span>' +
        '<span><b>位置:</b> ' + esc(jobs) + '</span>' +
        '<span class="badge">' + esc(r.p.team) + '</span>' +
      '</div>' +
      '<a class="link-btn" href="' + esc(r.roster.url) + '" target="_blank">打开该车表名单 →</a>';
    box.appendChild(div);
  });
}
function timeKey(s) {
  var m = String(s || '').match(/(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if (m) return [parseInt(m[1]), parseInt(m[2]), parseInt(m[3]), parseInt(m[4])];
  return [0, 0, 0, 0];
}
function isUpcoming(s, now) {
  var k = timeKey(s);
  if (k[0] === 0) return true;
  // 按日期过滤: 只要车表日期 >= 今天, 无论时间是否已过都显示
  var nk = [now.getMonth() + 1, now.getDate()];
  if (k[0] < nk[0]) return false;
  if (k[0] > nk[0]) return true;
  return k[1] >= nk[1];
}
function esc(s) {
  return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
document.getElementById('kw').addEventListener('keydown', function(e){ if(e.key === 'Enter') doQuery(); });
</script>
</body>
</html>
