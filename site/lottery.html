<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>史莱姆团 · 抽奖</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
  .header { background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; padding:24px 16px; text-align:center; }
  .header h1 { font-size:26px; letter-spacing:2px; }
  .header p { opacity:.9; font-size:14px; margin-top:6px; }
  .container { max-width:820px; margin:0 auto; padding:20px 16px 40px; }
  .card { background:#1e293b; border-radius:14px; padding:18px; margin-bottom:18px; border:1px solid #334155; }
  .card h2 { font-size:17px; margin-bottom:12px; color:#fbbf24; }
  .prizes { display:flex; flex-wrap:wrap; gap:10px; }
  .prize { background:#334155; border-radius:10px; padding:10px 14px; font-size:15px; border:1px solid #475569; }
  .prize.active { background:#f59e0b; color:#111; font-weight:700; border-color:#fbbf24; }
  .rules { font-size:14px; line-height:1.8; color:#cbd5e1; white-space:pre-wrap; }
  .stage { text-align:center; padding:28px 16px; }
  .stage .curPrize { font-size:18px; color:#fbbf24; margin-bottom:10px; }
  .stage .big { font-size:46px; font-weight:800; min-height:64px; line-height:64px; color:#fff; text-shadow:0 0 20px rgba(245,158,11,.6); }
  .stage .big.spin { color:#fbbf24; animation:blink .12s infinite; }
  .stage .sub { font-size:15px; color:#94a3b8; margin-top:8px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }
  .status { display:inline-block; padding:4px 14px; border-radius:20px; font-size:13px; margin-top:8px; }
  .status.idle { background:#334155; color:#cbd5e1; }
  .status.spin { background:#f59e0b; color:#111; animation:blink .6s infinite; }
  .status.done { background:#22c55e; color:#111; }
  .grid { display:flex; flex-direction:column; gap:6px; overflow-x:auto; }
  .trow { display:flex; flex-wrap:nowrap; align-items:center; gap:8px; padding:6px 10px; background:#1e293b; border-radius:10px; border:1px solid #334155; margin-bottom:6px; }
  .tname { font-weight:700; color:#fbbf24; font-size:14px; min-width:64px; flex-shrink:0; text-align:left; }
  .p { width:72px; height:34px; line-height:34px; text-align:center; background:#0f172a; border:1px solid #334155; border-radius:8px; font-size:14px; color:#cbd5e1; overflow:hidden; white-space:nowrap; }
  .p.lit { background:#f59e0b; color:#111; font-weight:700; box-shadow:0 0 10px rgba(245,158,11,.7); }
  .p.won { background:#0b1220; color:#475569; text-decoration:line-through; border-color:#1e293b; }
  .history { display:flex; flex-direction:column; gap:8px; }
  .hrow { display:flex; justify-content:space-between; align-items:center; background:#334155; border-radius:8px; padding:8px 12px; font-size:14px; }
  .hrow b { color:#fbbf24; }
  .btn { background:#f59e0b; color:#111; border:none; border-radius:8px; padding:12px 24px; font-size:16px; font-weight:700; cursor:pointer; }
  .btn:hover { background:#fbbf24; }
  .btn.gray { background:#475569; color:#e2e8f0; }
  .btn.green { background:#22c55e; }
  .btn.red { background:#ef4444; }
  .admin { border:1px dashed #f59e0b; }
  .admin label { font-size:13px; color:#94a3b8; display:block; margin:8px 0 4px; }
  .admin input, .admin textarea { width:100%; background:#0f172a; border:1px solid #475569; border-radius:8px; padding:8px 10px; color:#e2e8f0; font-size:14px; margin-bottom:6px; }
  .admin .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .foot { text-align:center; color:#64748b; font-size:12px; padding:16px; }
  #err { color:#f87171; font-size:13px; margin-top:8px; }
</style>

<div class="header">
  <h1>🎁 史莱姆团 · 抽奖</h1>
  <p>8.19 超魔之塔 · 实时抽奖</p>
</div>
<div class="container">

  <div class="card">
    <h2>🏆 奖品</h2>
    <div id="prizes" class="prizes">加载中...</div>
  </div>

  <div class="card">
    <h2>📜 抽奖方式</h2>
    <div id="rules" class="rules">加载中...</div>
  </div>

  <div class="card stage">
    <div class="curPrize" id="curPrize">当前奖品：-</div>
    <div class="big" id="big">等待开始</div>
    <div class="sub" id="stageSub"></div>
    <div><span class="status idle" id="statusTag">未开始</span></div>
    <div id="stageControls" style="display:none; margin-top:14px;">
      <button class="btn" onclick="startDraw()">▶ 开始抽奖</button>
      <button class="btn red" onclick="stopDraw()">■ 停止抽奖</button>
    </div>
    <div id="err"></div>
  </div>

  <div class="card">
    <h2>🎯 参与者（<span id="pcount">0</span>人）</h2>
    <div class="grid" id="pgrid"></div>
  </div>

  <div class="card">
    <h2>📋 中奖记录</h2>
    <div class="history" id="history">暂无</div>
  </div>

  <div class="card admin">
    <h2>🔧 主持人控制台</h2>
    <label>主持人密码</label>
    <input type="password" id="pwd" placeholder="输入密码解锁控制">
    <div id="adminArea" style="display:none">
      <label>奖品（每行一个，数量用 *N，如：时装*3）</label>
      <textarea id="prizesInput" rows="4"></textarea>
      <label>抽奖方式说明</label>
      <textarea id="rulesInput" rows="4"></textarea>
      <label>抽奖名单（每行一个：名字 或 名字,QQ 或 名字,QQ,队伍）</label>
      <textarea id="rosterInput" rows="6"></textarea>
      <label>从在线文档导入（粘贴腾讯文档链接，如 https://docs.qq.com/sheet/xxx?tab=xxx）</label>
      <input type="text" id="docUrlInput" placeholder="粘贴腾讯文档在线名单链接">
      <div class="row">
        <button class="btn" onclick="saveConfig()">保存奖品/规则</button>
        <button class="btn" onclick="importRoster()">📥 导入抽奖名单</button>
        <button class="btn" onclick="importFromDoc()">📄 从在线文档导入</button>
        <button class="btn green" onclick="exportWinners()">📤 导出中奖人</button>
        <button class="btn gray" onclick="clearWinners()">🧹 清除中奖记录</button>
        <button class="btn gray" onclick="resetAll()">↺ 重置全部</button>
      </div>
    </div>
  </div>

  <div class="foot">数据实时同步 Firebase · 页面自动更新</div>
</div>

var PWD = "slime2026"; // 主持人密码, 可自行修改
var db, root, state = {status:"idle", prizeIndex:0, winner:"", seed:0};
var participants = [], prizes = [], rules = "", winners = {};
var spinTimer = null;
var prevStatus = "";
var revealing = false;

function init() {
  if (firebaseConfig.apiKey.indexOf("PASTE") >= 0) {
    document.getElementById("err").textContent = "Firebase 配置未填写";
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    root = db.ref("lottery");
    listenAll();
  } catch(e) {
    document.getElementById("err").textContent = "Firebase 初始化失败: " + e.message;
  }
}

function listenAll() {
  root.child("participants").on("value", function(s){ 
    participants = s.val() || [];
    if (!participants.length && DEFAULT_PARTICIPANTS.length) {
      // 首次自动载入
      root.child("participants").set(DEFAULT_PARTICIPANTS);
      participants = DEFAULT_PARTICIPANTS;
    }
    renderGrid();
  });
  root.child("prizes").on("value", function(s){ prizes = s.val() || []; renderPrizes(); });
  root.child("rules").on("value", function(s){ rules = s.val() || ""; document.getElementById("rules").textContent = rules; });
  root.child("winners").on("value", function(s){ winners = s.val() || {}; renderHistory(); renderGrid(); renderStage(); });
  root.child("state").on("value", function(s){
    var old = prevStatus;
    state = s.val() || {status:"idle", prizeIndex:0, winner:"", seed:0, startP:0, stopP:0};
    prevStatus = state.status;
    if (state.status === "done") {
      stopSpin();
      if (old === "spinning") playReveal(state.winner);
      else renderStage();
      return;
    }
    if (state.status === "spinning") startSpin();
    else stopSpin();
    renderStage();
  });
}

function prizeQty(i) { var m = String(prizes[i]||"").match(/\*(\d+)\s*$/); return m ? parseInt(m[1]) : 1; }
function prizeLabel(i) { return String(prizes[i]||"").replace(/\*\d+\s*$/, "").trim(); }
function winnersOf(i) { return winners[i] || []; }
function currentPrizeIndex() {
  for (var i=0;i<prizes.length;i++) if (winnersOf(i).length < prizeQty(i)) return i;
  return -1;
}
function allWinners() {
  var a = [];
  Object.keys(winners).forEach(function(k){ a = a.concat((winners[k] || []).map(winName)); });
  return a;
}
function remainingPool() {
  var w = allWinners();
  return participants.filter(function(p){ return w.indexOf(p.name) < 0; }).map(function(p){ return p.name; });
}

function renderPrizes() {
  var box = document.getElementById("prizes");
  box.innerHTML = "";
  var cur = (state.status === "done" && state.prizeIndex != null) ? state.prizeIndex : currentPrizeIndex();
  prizes.forEach(function(p, i){
    var d = document.createElement("div");
    d.className = "prize" + (i === cur ? " active" : "");
    d.textContent = (i+1) + ". " + prizeLabel(i) + (prizeQty(i)>1 ? " ×"+prizeQty(i) : "") + (winnersOf(i).length ? "（" + winnersOf(i).length + "/" + prizeQty(i) + "）" : "");
    box.appendChild(d);
  });
  if (!prizes.length) box.textContent = "暂无奖品";
}

function findP(name) {
  for (var i=0;i<participants.length;i++) if (participants[i].name === name) return participants[i];
  return null;
}

function winName(o) { return (typeof o === "object") ? o.n : o; }
function winSeed(o) { return (typeof o === "object") ? (o.s || "") : ""; }

function normTeam(t) {
  return String(t || "").replace(/功能队/g, "").replace(/（D队）/g, "").replace(/（E队）/g, "").replace(/（F队）/g, "").replace(/功能位/g, "").replace(/（）/g, "").replace(/\(\)/g, "").trim();
}

function renderGrid() {
  var box = document.getElementById("pgrid");
  box.innerHTML = "";
  document.getElementById("pcount").textContent = participants.length;
  var shown = [];
  TEAM_ORDER.forEach(function(team){
    var members = participants.filter(function(p){ return normTeam(p.team) === team; });
    shown = shown.concat(members);
    if (!members.length) return;
    var row = document.createElement("div");
    row.className = "trow";
    var tl = document.createElement("span");
    tl.className = "tname";
    tl.textContent = team;
    row.appendChild(tl);
    members.forEach(function(p){
      var d = document.createElement("div");
      d.className = "p" + (allWinners().indexOf(p.name) >= 0 ? " won" : "");
      d.id = "p_" + p.name;
      d.textContent = p.name;
      row.appendChild(d);
    });
    box.appendChild(row);
  });
  // 未分队/荣誉人员: 显示在"名誉抽奖位"行
  var others = participants.filter(function(p){ return shown.indexOf(p) < 0; });
  if (others.length) {
    var row2 = document.createElement("div");
    row2.className = "trow";
    var tl2 = document.createElement("span");
    tl2.className = "tname";
    tl2.textContent = "名誉抽奖位";
    row2.appendChild(tl2);
    others.forEach(function(p){
      var d = document.createElement("div");
      d.className = "p" + (allWinners().indexOf(p.name) >= 0 ? " won" : "");
      d.id = "p_" + p.name;
      d.textContent = p.name;
      row2.appendChild(d);
    });
    box.appendChild(row2);
  }
  if (!participants.length) box.textContent = "暂无参与者";
}

function renderHistory() {
  var box = document.getElementById("history");
  box.innerHTML = "";
  var keys = Object.keys(winners).sort(function(a,b){return (+a) - (+b);});
  if (!keys.length) { box.textContent = "暂无"; return; }
  keys.forEach(function(k){
    var arr = winners[k] || [];
    if (!arr.length) return;
    var row = document.createElement("div");
    row.className = "hrow";
    var names = arr.map(winName).map(function(n){ var pp = findP(n); return esc(n) + (pp && pp.qq ? "（QQ " + esc(pp.qq) + "）" : ""); }).join("、");
    row.innerHTML = "<span><b>第" + (+k+1) + "项</b> · " + esc(prizeLabel(+k)) + (prizeQty(+k)>1 ? "×"+prizeQty(+k) : "") + "</span><span>🏆 " + names + "</span>";
    box.appendChild(row);
  });
}

function renderStage() {
  var big = document.getElementById("big");
  var tag = document.getElementById("statusTag");
  var sub = document.getElementById("stageSub");
  var cur = (state.status === "done" && state.prizeIndex != null) ? state.prizeIndex : currentPrizeIndex();
  var curPrizeEl = document.getElementById("curPrize");
  if (cur < 0) {
    curPrizeEl.textContent = "当前奖品：已全部抽完 🎉";
  } else {
    var qty = prizeQty(cur), done = winnersOf(cur).length;
    curPrizeEl.textContent = "当前奖品：" + prizeLabel(cur) + (qty > 1 ? "（" + done + "/" + qty + "份）" : "");
  }
  if (revealing && state.status === "done") {
    // 揭晓动画期间, 大屏由 playReveal 控制, 避免互相覆盖
    renderPrizes();
    return;
  }
  if (state.status === "spinning") {
    tag.className = "status spin"; tag.textContent = "抽奖中...";
    sub.textContent = "主持人在滚动，请稍候";
  } else if (state.status === "done") {
    big.className = "big"; big.textContent = state.winner || "?";
    tag.className = "status done"; tag.textContent = "已定";
    var wp = findP(state.winner);
    var doneCopy = winnersOf(state.prizeIndex).length;
    var q2 = prizeQty(state.prizeIndex);
    sub.textContent = "🎉 恭喜 " + (state.winner || "") + (wp && wp.qq ? "（QQ " + wp.qq + "）" : "") + " 获得：" + prizeLabel(state.prizeIndex) + (q2 > 1 ? "（第" + doneCopy + "/" + q2 + "份）" : "");
  } else {
    big.className = "big"; big.textContent = "等待开始";
    tag.className = "status idle"; tag.textContent = "未开始";
    sub.textContent = prizes.length ? "主持人点击「开始抽奖」后自动滚动" : "";
  }
  renderPrizes();
}

function hashStr(s) {
  var h = 2166136261;
  for (var i=0;i<s.length;i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function startSpin() {
  stopSpin();
  var seed = state.seed || (Date.now().toString(36));
  var big = document.getElementById("big");
  big.className = "big spin";
  var rng = mulberry32(hashStr(seed));
  var delay = 55;
  function tick() {
    if (state.status !== "spinning") { stopSpin(); return; }
    var pool = remainingPool();
    if (!pool.length) { stopSpin(); return; }
    var n = pool[Math.floor(rng() * pool.length)];
    big.textContent = n;
    var grid = document.getElementById("pgrid");
    var els = grid.getElementsByClassName("lit");
    for (var i=0;i<els.length;i++) els[i].classList.remove("lit");
    var cell = document.getElementById("p_" + n);
    if (cell) cell.classList.add("lit");
    spinTimer = setTimeout(tick, delay); // 匀速快滚
  }
  tick();
}
function stopSpin() {
  if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }
}

// 停止后: 固定数量的慢速滚动(由种子生成), 最后落回中奖者并静止显示
function playReveal(winner) {
  stopSpin();
  revealing = true;
  var big = document.getElementById("big");
  var tag = document.getElementById("statusTag");
  var seed = state.seed || (Date.now().toString(36));
  var rng = mulberry32(hashStr(seed));
  var pool = remainingPool();
  var count = 8; // 固定慢速次数(全端一致)
  var names = [];
  if (pool.length) {
    for (var i=0;i<count;i++) names.push(pool[Math.floor(rng() * pool.length)]);
  }
  names.push(winner); // 最后一个一定是中奖者
  var delay = 300;   // 每步间隔(持续慢速)
  var idx = 0;
  function step() {
    var n = names[idx];
    big.textContent = n;
    // 只在滚动过程闪烁, 最后静止
    big.className = (idx < names.length - 1) ? "big spin" : "big";
    tag.className = "status spin"; tag.textContent = "揭晓中...";
    var cell = document.getElementById("p_" + n);
    if (cell) {
      var els = document.getElementById("pgrid").getElementsByClassName("lit");
      for (var i=0;i<els.length;i++) els[i].classList.remove("lit");
      cell.classList.add("lit");
    }
    idx++;
    if (idx < names.length) {
      setTimeout(step, delay);
    } else {
      revealing = false;
      big.className = "big";
      renderStage(); // 显示最终结果(静止)
    }
  }
  step();
}

// ---------- 主持人控制 ----------
document.getElementById("pwd").addEventListener("input", function(){
  if (this.value === PWD) {
    document.getElementById("adminArea").style.display = "block";
    document.getElementById("stageControls").style.display = "block";
    document.getElementById("prizesInput").value = prizes.join("\n");
    document.getElementById("rulesInput").value = rules;
    document.getElementById("rosterInput").value = participants.map(function(p){
      return [p.name, p.qq, p.team].filter(Boolean).join(",");
    }).join("\n");
  }
});

function importRoster() {
  var txt = document.getElementById("rosterInput").value.trim();
  if (!txt) { alert("请先粘贴抽奖名单"); return; }
  var list = txt.split(/\n/).map(function(s){ return s.trim(); }).filter(Boolean).map(function(line){
    var parts = line.split(/[,，\t]/).map(function(s){ return s.trim(); });
    return {name: parts[0], qq: parts[1] || "", team: parts[2] || ""};
  }).filter(function(p){ return p.name; });
  if (!list.length) { alert("名单解析为空"); return; }
  if (!confirm("导入 " + list.length + " 人并覆盖当前名单？(同时清空中奖记录)")) return;
  root.child("participants").set(list);
  root.update({winners: {}, state: {status:"idle", prizeIndex:0, winner:"", seed:0}});
}

function importFromDoc() {
  var url = document.getElementById("docUrlInput").value.trim();
  if (!url) { alert("请先粘贴在线文档链接"); return; }
  fetch("http://127.0.0.1:8001/read?url=" + encodeURIComponent(url))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) { alert("读取失败：" + (d.error || "")); return; }
      if (!d.players || !d.players.length) { alert("名单为空或未解析到玩家"); return; }
      if (!confirm("从文档读取到 " + d.players.length + " 人，导入并覆盖当前名单？(同时清空中奖记录)")) return;
      root.child("participants").set(d.players);
      root.update({winners: {}, state: {status:"idle", prizeIndex:0, winner:"", seed:0}});
      alert("已导入 " + d.players.length + " 人！");
    })
    .catch(function(){
      alert("无法连接导入服务。\n请在主持人电脑上运行 lottery_server.py，并用 http://127.0.0.1:8001/lottery.html 打开本页后再导入。");
    });
}

function exportWinners() {
  var keys = Object.keys(winners).sort(function(a,b){ return (+a) - (+b); });
  var rows = [["奖品序号","奖品","中奖者","QQ","队伍","随机种子(起止时刻)"]];
  var has = false;
  keys.forEach(function(k){
    (winners[k] || []).forEach(function(o){
      var n = winName(o);
      var pp = findP(n);
      rows.push([(+k+1), prizeLabel(+k), n, pp ? pp.qq : "", pp ? pp.team : "", winSeed(o)]);
      has = true;
    });
  });
  if (!has) { alert("还没有中奖记录"); return; }
  var csv = "\uFEFF" + rows.map(function(r){
    return r.map(function(c){ var s = String(c == null ? "" : c); if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"'; return s; }).join(",");
  }).join("\r\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "中奖名单.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saveConfig() {
  var ps = document.getElementById("prizesInput").value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
  root.update({prizes: ps, rules: document.getElementById("rulesInput").value});
}

function pickFromSeed(seed, pool) {
  // 由种子确定性选出中奖者(简单hash), 结果在开始时已定
  var h = 2166136261;
  for (var i=0;i<seed.length;i++) { h ^= seed.charCodeAt(i); h = (h*16777619) >>> 0; }
  return pool[h % pool.length];
}

function startDraw() {
  if (state.status === "spinning") return;
  var idx = currentPrizeIndex();
  if (idx < 0) { alert("所有奖品都已抽完"); return; }
  var rem = remainingPool();
  if (!rem.length) { alert("候选人为空"); return; }
  // 管理员生成并上传随机种子(公开可见), 客户端以此种子播放同步滚动动画
  var seed = Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  var startP = performance.now();
  root.child("state").set({status:"spinning", prizeIndex:idx, winner:"", seed:seed,
                           startP:startP, startAt:Date.now(), stopP:0, stopAt:0});
}

function stopDraw() {
  if (state.status !== "spinning") return;
  var idx = state.prizeIndex;
  var rem = remainingPool();
  if (!rem.length) { alert("候选人为空"); return; }
  // 高精度记录停止时刻, 中奖者由「开始时上传的种子 + 停止时刻」共同决定
  var stopP = performance.now();
  var seed = (state.seed || "") + "-" + stopP.toFixed(3);
  var w = pickFromSeed(seed, rem);
  var arr = winnersOf(idx).concat([{n: w, s: seed}]);
  var upd = {};
  upd["state"] = {status:"done", prizeIndex:idx, winner:w, seed:seed,
                  startP:state.startP || 0, startAt:state.startAt || 0, stopP:stopP, stopAt:Date.now()};
  upd["winners/" + idx] = arr;
  root.update(upd);
}

function clearWinners() {
  if (!confirm("确定清除所有中奖记录？(保留奖品/规则/参与者，可重新抽)")) return;
  root.update({winners: {}, state: {status:"idle", prizeIndex:0, winner:"", seed:0}});
}

function resetAll() {
  if (!confirm("确定清空所有抽奖记录并重置？")) return;
  root.update({winners: {}, state: {status:"idle", prizeIndex:0, winner:"", seed:0}});
}

function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

init();
